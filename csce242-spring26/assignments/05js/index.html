<!DOCTYPE html>
<html>

<body>
    <header>
        <h1>Assignment 7</h1>
        <h2>Introduction to JavaScript</h2>
    </header>
    <main>
        <div id="assignment" class="columns">
            <section id="speech">
                <h3>Speech</h3>
                <div id="bubble-container" class="hidden">
                <p class="speech-bubble" id="bubble-content"></p>
                </div>
            </section>
            <section id="beverage">
                <h3>Beverage</h3>
                <p>Pick your morning beverage</p>
                <select id="bev-options">
                    <option id="coffee">Coffee</option>
                    <option id="oj">Orange Juice</option>
                    <option id="redbull">RedBull</option>
                </select>
                <p id="choice"></p>
                
            </section>
            <section id="sticker">
                <h3>Add a Sticker</h3>
                <div id="img-container">
                    <img id="sticker-img" src="images/sticker.png"/>
                </div>
                    <p id="lil-sticker">&#9728;&#65039;</p>
                
            </section>
        </div>
        
    </main>
    <footer>
        <p>&copy;bigbenlund</p>
    </footer>
